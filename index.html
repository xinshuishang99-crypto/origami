<style>

<div id="dcw" style="grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:12px">分割数を入力<input type="number" id="dn" min="1" max="256" step="1" placeholder="例:12" aria-label="分割数" style="width:72px;min-height:36px;font-size:16px;padding:0 6px;border:1px solid var(--bd);border-radius:8px;background:var(--panel);color:var(--fg)"><button id="da">適用</button></div>
<select id="div" aria-label="分割数"><option value="0">0分割(グリッドなし)</option><option value="3">3分割</option><option value="4">4分割</option><option value="8" selected>8分割</option><option value="16">16分割</option><option value="24">24分割</option><option value="32">32分割</option><option value="64">64分割</option></select>

<div style="grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:12px">角度<input type="number" id="ca" value="30" step="any" aria-label="回転の角度(度)" style="width:64px;min-height:36px;font-size:16px;padding:0 6px;border:1px solid var(--bd);border-radius:8px;background:var(--panel);color:var(--fg)">°<label><input type="checkbox" id="cf"> 吸着しない</label></div>

<div id="lst" hidden></div>
<div id="stage"><div id="ur"><button id="undo" aria-label="もどる">←</button><button id="redo" aria-label="すすむ">→</button></div><div id="wrap"><canvas id="cv"></canvas><canvas id="cv3" hidden></canvas></div><div id="spl" hidden></div><div id="refs" hidden><div id="ref" hidden><div id="rbar"><button id="rzi">＋</button><button id="rzo">－</button><button id="rzf">全体</button><button id="rzx">画像を閉じる</button></div><div id="rv"><img id="ri" alt="参考画像"></div></div><div id="ref2" hidden><div id="rbar2"><button id="rzi2">＋</button><button id="rzo2">－</button><button id="rzf2">全体</button><button id="rzx2">画像を閉じる</button></div><div id="rv2"><img id="ri2" alt="参考画像2"></div></div></div></div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap'),st=document.getElementById('st');
let n=8,tool='M',strokes=[],hist=[],redoH=[],redoFor=null,drag=null,S=300,pad=15,cell=10,dpr=1,pts=[],foldMode=false,foldPolys=[],baseFace=0;
const key=p=>Math.round(p[0]*1e6)+','+Math.round(p[1]*1e6);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const px=x=>pad+x*cell;
function onSeg(p,a,b){const cr=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);if(Math.abs(cr)>1e-9)return false;const d=(p[0]-a[0])*(b[0]-a[0])+(p[1]-a[1])*(b[1]-a[1]),L=(b[0]-a[0])**2+(b[1]-a[1])**2;return d>=-1e-9&&d<=L+1e-9}
function build(all){
  const E=new Map(),real=all?strokes:strokes.filter(s=>s.t!=='A');
  for(const s of real){
    const a=s.a,b=s.b,dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy,pts=[[a,0],[b,1]];
    for(const o of real){
      if(o===s)continue;
      for(const p of [o.a,o.b])if(onSeg(p,a,b))pts.push([p,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L]);
      const ex=o.b[0]-o.a[0],ey=o.b[1]-o.a[1],den=dx*ey-dy*ex;
      if(Math.abs(den)>1e-12){
        const t=((o.a[0]-a[0])*ey-(o.a[1]-a[1])*ex)/den,u=((o.a[0]-a[0])*dy-(o.a[1]-a[1])*dx)/den;
        if(t>-1e-9&&t<1+1e-9&&u>-1e-9&&u<1+1e-9)pts.push([[a[0]+t*dx,a[1]+t*dy],t]);
      }
    }
    pts.sort((p,q)=>p[1]-q[1]);
    for(let i=0;i<pts.length-1;i++){
      const p=pts[i][0],q=pts[i+1][0],k1=key(p),k2=key(q);
      if(k1===k2)continue;
      E.set(k1<k2?k1+'|'+k2:k2+'|'+k1,{p,q,t:s.t});
    }
  }
  return [...E.values()];
}
function analyze(edges){
  const V=new Map();
  const add=(p,q,t)=>{const k=key(p);if(!V.has(k))V.set(k,{x:p[0],y:p[1],e:[]});V.get(k).e.push({a:Math.atan2(q[1]-p[1],q[0]-p[0]),t})};
  edges.forEach(e=>{add(e.p,e.q,e.t);add(e.q,e.p,e.t)});
  const res=[];
  for(const v of V.values()){
    if(v.x<1e-9||v.y<1e-9||v.x>n-1e-9||v.y>n-1e-9){res.push({v,bd:true,ok:true,r:[]});continue}
    const r=[],d=v.e.length;
    if(d%2)r.push('線の数が奇数('+d+'本)');
    else{
      const m=v.e.filter(e=>e.t==='M').length,vl=d-m;
      if(Math.abs(m-vl)!==2)r.push('山'+m+'本・谷'+vl+'本(前川定理:差は2)');
      const as=v.e.map(e=>e.a).sort((x,y)=>x-y);let s0=0;
      for(let i=0;i<d;i++){const nx=i+1<d?as[i+1]:as[0]+2*Math.PI;if(i%2===0)s0+=nx-as[i]}
      if(Math.abs(s0-Math.PI)>1e-6)r.push('角度の交互和が180°でない(川崎定理)');
    }
    res.push({v,ok:!r.length,r});
  }
  return res;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
  const g=css('--grid'),M=css('--m'),Vc=css('--v'),A=css('--a'),ER=css('--err'),OK=css('--ok'),fg=css('--fg');
  ctx.strokeStyle=g;ctx.lineWidth=gw;
  if(bgI){ctx.save();ctx.globalAlpha=bgOp;ctx.drawImage(bgI.img,px(bgI.x*n),px(bgI.y*n),bgI.w*bgI.s*n*cell,bgI.h*bgI.s*n*cell);ctx.restore()}
  if(showGrid&&!isGO())for(let i=0;i<=n;i++){ctx.beginPath();ctx.moveTo(px(i),px(0));ctx.lineTo(px(i),px(n));ctx.moveTo(px(0),px(i));ctx.lineTo(px(n),px(i));ctx.stroke()}
  ctx.strokeStyle=fg;ctx.lineWidth=2;ctx.strokeRect(px(0),px(0),n*cell,n*cell);
  const line=(a,b,c,w,dash)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(px(a[0]),px(a[1]));ctx.lineTo(px(b[0]),px(b[1]));ctx.stroke();ctx.setLineDash([])};
  strokes.filter(s=>s.t==='A').forEach(s=>line(s.a,s.b,A,1,[]));
  const edges=build();
  if(fadeOK||showMae){ctx.globalAlpha=0.55;kawGuides().forEach(g=>{const t=showMae?g.mk:null;line(g.v,g.end,t==='M'?M:t==='V'?Vc:(showMae?A:OK),t?2.5:2,t==='M'?[10,4,2,4]:t==='V'?[6,5]:[4,5])});ctx.globalAlpha=1}
  if(showBoth){validGuides().forEach(g=>{const c=g.mk==='M'?M:Vc;ctx.globalAlpha=0.28;line(g.v,g.end,c,9,[]);ctx.globalAlpha=0.7;line(g.v,g.end,c,2.5,g.mk==='M'?[10,4,2,4]:[6,5])});ctx.globalAlpha=1}
  edges.forEach(e=>line(e.p,e.q,e.t==='M'?M:Vc,lw,e.t==='M'?[10,4,2,4]:[6,5]));
  if(drag&&tool!=='E')line(drag.a,drag.b,tool==='M'?M:tool==='V'?Vc:A,tool==='A'?1:lw,[4,4]);
  const an=analyze(edges),bad=an.filter(a=>!a.ok);
  an.forEach(a=>{
    if(a.bd||!showVtx)return;
    ctx.beginPath();
    if(a.ok){ctx.fillStyle=OK;ctx.arc(px(a.v.x),px(a.v.y),4,0,7);ctx.fill()}
    else{ctx.strokeStyle=ER;ctx.lineWidth=3;ctx.arc(px(a.v.x),px(a.v.y),9,0,7);ctx.stroke()}
  });
  const f=x=>Math.round(x*100)/100;
  if(!edges.length)st.innerHTML='格子点から格子点へ線を引いてください。内部の頂点は、すべて平らに折れる条件を満たすと緑、満たさないと赤の丸で示されます。';
  else if(!bad.length)st.innerHTML='<span class="ok">すべての頂点が条件を満たしています</span><br>(各頂点で平坦に折れるための必要条件です。紙全体の重なり順までは判定していません)';
  else st.innerHTML='<span class="ng">条件を満たさない頂点: '+bad.length+'個</span><br>'+bad.slice(0,3).map(b=>'('+f(b.v.x)+', '+f(b.v.y)+') '+b.r.join(' / ')).join('<br>');
}
function pos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left-OX)/Z,(e.clientY-r.top-OY)/Z]}
let ip=[];
function endPt(e){
  if(document.getElementById('sm').value!=='a')return snap(e);
  const a=drag.a,[x,y]=pos(e),dx=(x-pad)/cell-a[0],dy=(y-pad)/cell-a[1];
  if(Math.hypot(dx,dy)<1e-6)return a;
  const bases=[0];for(const s of strokes)if(onSeg(a,s.a,s.b))bases.push(Math.atan2(s.b[1]-s.a[1],s.b[0]-s.a[0]));if(fadeOK||showMae||showBoth)kawGuides().forEach(g=>{if(Math.hypot(g.v[0]-a[0],g.v[1]-a[1])<1e-6)bases.push(g.ang)});
  const step=Math.PI/8,cur=Math.atan2(dy,dx),z=v=>Math.abs(v)<1e-9?0:v;let ang=0,bestD=9;
  for(const b of bases){const cand=b+Math.round((cur-b)/step)*step,d=Math.abs(Math.atan2(Math.sin(cur-cand),Math.cos(cur-cand)));if(d<bestD){bestD=d;ang=cand}}
  const ux=z(Math.cos(ang)),uy=z(Math.sin(ang));
  let tm=Infinity;
  for(const [c,d] of [[a[0],ux],[a[1],uy]]){if(d>1e-12)tm=Math.min(tm,(n-c)/d);else if(d<-1e-12)tm=Math.min(tm,-c/d)}
  const len=Math.min(Math.max(0,dx*ux+dy*uy),tm),C=[tm];
  for(const s of strokes){
    const ex=s.b[0]-s.a[0],ey=s.b[1]-s.a[1],den=ux*ey-uy*ex;
    if(Math.abs(den)<1e-12)continue;
    const t=((s.a[0]-a[0])*ey-(s.a[1]-a[1])*ex)/den,w=((s.a[0]-a[0])*uy-(s.a[1]-a[1])*ux)/den;

    h1.tw=h2;h2.tw=h1;out.get(a).push(h1);out.get(b).push(h2);
  });
  out.forEach(l=>l.sort((x,y)=>x.ang-y.ang));
  const F=[];
  out.forEach(l=>l.forEach(h=>{
    if(h.f>=0)return;
    const poly=[],id=F.length;let c=h,g=0,area=0;
    do{c.f=id;poly.push(vp.get(c.u));const l2=out.get(c.v),i=l2.indexOf(c.tw);c=l2[(i-1+l2.length)%l2.length]}while(c!==h&&++g<5000);
    for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];area+=p[0]*q[1]-q[0]*p[1]}
    F.push({poly,area:area/2});
  }));
  return {F,out,vp};
}
function fold(base){
  const {F,out,vp}=faces(),inner=F.map(f=>f.area>1e-9),adj=F.map(()=>[]);
  out.forEach(l=>l.forEach(h=>{if((h.t==='M'||h.t==='V')&&inner[h.f]&&inner[h.tw.f])adj[h.f].push(h)}));
  const T=[],q=[],b=inner[base]?base:inner.indexOf(true),ap=(M,p)=>[M[0]*p[0]+M[1]*p[1]+M[4],M[2]*p[0]+M[3]*p[1]+M[5]];
  let bad=0;T[b]=[1,0,0,1,0,0];q.push(b);
  while(q.length){
    const i=q.shift(),Fm=T[i];
    for(const h of adj[i]){
      const j=h.tw.f,pa=vp.get(h.u),pb=vp.get(h.v),L=Math.hypot(pb[0]-pa[0],pb[1]-pa[1]),ux=(pb[0]-pa[0])/L,uy=(pb[1]-pa[1])/L,dot=ux*pa[0]+uy*pa[1];
      const aR=2*ux*ux-1,bR=2*ux*uy,dR=2*uy*uy-1,eR=2*(pa[0]-dot*ux),fR=2*(pa[1]-dot*uy);
      const N=[Fm[0]*aR+Fm[1]*bR,Fm[0]*bR+Fm[1]*dR,Fm[2]*aR+Fm[3]*bR,Fm[2]*bR+Fm[3]*dR,Fm[0]*eR+Fm[1]*fR+Fm[4],Fm[2]*eR+Fm[3]*fR+Fm[5]];
      if(!T[j]){T[j]=N;q.push(j)}
      else for(const p of [pa,pb]){const x=ap(T[j],p),y=ap(N,p);if(Math.hypot(x[0]-y[0],x[1]-y[1])>1e-6){bad++;break}}
    }
  }
  return {F,T,bad,b};
}
function drawFold(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);foldPolys=[];
  const r=fold(baseFace),L=[];
  r.F.forEach((f,i)=>{if(r.T[i])L.push({i,poly:f.poly.map(p=>[r.T[i][0]*p[0]+r.T[i][1]*p[1]+r.T[i][4],r.T[i][2]*p[0]+r.T[i][3]*p[1]+r.T[i][5]]),front:r.T[i][0]*r.T[i][3]-r.T[i][1]*r.T[i][2]>0})});
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  L.forEach(f=>f.poly.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}));
  const m=S*0.1,sc=Math.min((S-2*m)/Math.max(x1-x0,1e-6),(S-2*m)/Math.max(y1-y0,1e-6)),ox=(S-sc*(x1-x0))/2-sc*x0,oy=(S-sc*(y1-y0))/2-sc*y0;
  ctx.lineWidth=1.5;ctx.strokeStyle=css('--fg');
  L.forEach(f=>{
    f.poly=f.poly.map(p=>[ox+sc*p[0],oy+sc*p[1]]);foldPolys.push(f);
    ctx.fillStyle=trans?(f.front?'rgba(70,130,230,0.4)':'rgba(240,160,40,0.4)'):(f.front?'rgb(130,170,235)':'rgb(240,195,110)');
    ctx.beginPath();f.poly.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke();
  });
  st.innerHTML=(r.bad?'<span class="ng">全体として平らに折れません(面の位置が矛盾する折り目が '+r.bad+' か所)</span>':'<span class="ok">全体の形は矛盾なく平らに折りたためます</span>')+'<br>青=表、橙=裏。面をタップすると、その面を土台(動かさない面)にします。重なる順番までは判定せず、'+(trans?'半透明で重ねて表示しています。':'不透明で表示しています。重なる順番は面の並び順で、実際の上下とは異なります。')+'';
}
const draw0=draw;
draw=function(){
  st0(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  if(d3){draw3d();return}
  if(foldMode){drawFold();return}
  draw0();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.strokeStyle=css('--a');ctx.lineWidth=1.5;
  if(showMid)build(true).forEach(g=>{const x=px((g.p[0]+g.q[0])/2),y=px((g.p[1]+g.q[1])/2);ctx.strokeRect(x-3,y-3,6,6)});
  ctx.fillStyle=css('--fg');
  pts.forEach(p=>{ctx.beginPath();ctx.arc(px(p[0]),px(p[1]),6,0,7);ctx.fill()});
  if(er&&er.trail.length>1){ctx.save();ctx.globalAlpha=0.3;ctx.strokeStyle='#e04040';ctx.lineWidth=24/Z;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();er.trail.forEach((q,i)=>i?ctx.lineTo(px(q[0]),px(q[1])):ctx.moveTo(px(q[0]),px(q[1])));ctx.stroke();ctx.restore()}
  if(hov&&!d3&&!foldMode){ctx.strokeStyle='#e0a000';ctx.lineWidth=2/Z;ctx.beginPath();ctx.arc(px(hov[0]),px(hov[1]),9,0,7);ctx.stroke()}
  if(showMae)drawMae();
  if(cAxS){ctx.strokeStyle='#e0a000';ctx.lineWidth=4/Z;ctx.beginPath();ctx.moveTo(px(cAxS.a[0]),px(cAxS.a[1]));ctx.lineTo(px(cAxS.b[0]),px(cAxS.b[1]));ctx.stroke()}
  if(tool==='C'&&G('cm').value==='ax'){st.innerHTML='<b>'+(cAxS?'② 複製元にする側をタップ(その側の線を反対側へ複製します)':'① 軸にする線をタップ')+'</b><br>'+st.innerHTML}else if(tool==='C')st.innerHTML='<b>'+(document.getElementById('cm').value[0]==='r'?'回転の中心にする点をタップ(全体を回転して複製します)':'複製元にする側をタップ(その側の線を反対側へ複製します)')+'</b><br>'+st.innerHTML;
  if(tool==='P')st.innerHTML='<b>'+['①垂線を通す点をタップ','②基準にする線をタップ'][pts.length]+'</b><br>'+st.innerHTML;
  if(tool==='X')st.innerHTML='<b>'+['①延長する線の1点目をタップ','②2点目をタップ(2点を通る線を紙の端まで引きます)'][pts.length]+'</b><br>'+st.innerHTML;
  if(tool[0]==='B')st.innerHTML='<b>'+['①角の片方の腕の上の点をタップ','②角の頂点をタップ','③もう片方の腕の上の点をタップ'][pts.length]+'</b><br>'+st.innerHTML;
};
document.getElementById('undo').onclick=()=>{if(hist.length){redoFor=hist;redoH.push(JSON.stringify({n,s:strokes}));const o=JSON.parse(hist.pop());strokes=o.s;if(o.n!==n){n=o.n;document.getElementById('div').value=String(n);layout()}else draw()}};
document.getElementById('redo').onclick=()=>{if(redoFor!==hist)redoH.length=0;if(redoH.length){hist.push(JSON.stringify({n,s:strokes}));const o=JSON.parse(redoH.pop());strokes=o.s;if(o.n!==n){n=o.n;document.getElementById('div').value=String(n);layout()}else draw()}};
(()=>{
  const b=document.getElementById('clear');let to=null,cb=null;
  const reset=()=>{clearTimeout(to);b.textContent='全消去';b.classList.remove('danger');if(cb){cb.remove();cb=null}};
  b.onclick=()=>{
    if(!strokes.length)return;
    if(!cb){
      b.textContent='本当に消去する';b.classList.add('danger');
      cb=document.createElement('button');cb.textContent='キャンセル';cb.onclick=reset;b.after(cb);
      to=setTimeout(reset,5000);return;
    }
    reset();snapshot();strokes=[];draw();
  };
})();
document.getElementById('div').onchange=e=>{
  if(e.target.value==='0'){pts=[];cAxS=null;draw();return}
  const m=+e.target.value,k=m/n,r=v=>Math.round(v*1e9)/1e9;
  snapshot();
  strokes=strokes.map(s=>({a:[r(s.a[0]*k),r(s.a[1]*k)],b:[r(s.b[0]*k),r(s.b[1]*k)],t:s.t}));
  n=m;pts=[];cAxS=null;layout();
};
function layout(){ensureDiv(n);
  const r=wrap.getBoundingClientRect();S=Math.max(200,Math.floor(Math.min(r.width-16,r.height-8)));
  dpr=window.devicePixelRatio||1;cv.style.width=cv.style.height=S+'px';cv.width=cv.height=S*dpr;
  pad=Math.max(14,S*0.04);cell=(S-2*pad)/n;draw();
}
new ResizeObserver(layout).observe(wrap);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
layout();
initStore();
(()=>{
  const t=document.getElementById('top'),sv=document.getElementById('sv');
  ['tf','tk','tb','tp','tg','tm','tv'].forEach(id=>t.insertBefore(document.getElementById(id),sv));
  t.insertBefore(document.querySelector('[data-t="H"]'),sv);
  ['clear'].forEach(id=>t.insertBefore(document.getElementById(id),sv));
  const side=G('side'),bar=side.querySelector('.bar'),T=k=>document.querySelector('[data-t="'+k+'"]');
  const mk=(title,open,items)=>{
    const d=document.createElement('details'),s=document.createElement('summary'),b=document.createElement('div');
    d.className='grp';d.open=open;s.textContent=title;b.className='gb';d.append(s,b);
    items.forEach(el=>{if(el)b.append(el)});
    side.append(d);
  };
  mk('描く',true,[T('M'),T('V'),T('A'),G('sm')]);
  mk('消す',true,[T('E'),T('EW')]);
  mk('作図の補助',true,[T('B2'),T('B3'),T('P'),T('X'),G('bt')]);
  mk('複製',false,[T('C'),G('cm'),G('ca').parentElement]);
  mk('グリッド・表示',true,[G('div'),G('dcw'),G('gw').parentElement,G('zin'),G('zout'),G('zfit')]);
  mk('折りたたみ',false,[G('fold'),G('d3b'),G('fr'),G('pl'),G('tr')]);
  mk('画像・トレース',true,[G('imgb'),G('imgf'),G('bgb'),G('bgf'),T('BG'),G('bgl'),G('bgfit'),G('bgs').parentElement,G('bgo').parentElement,G('bgx')]);
  if(bar.children.length)mk('その他',false,[...bar.children]);
  bar.remove();
})();
</script>
